<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>SHARK — Hunt. Trade. Dominate.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Подключение Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg-void: #05070d;
    --bg-deep: #0a0f1c;
    --bg-panel: #0f1626;
    --bg-panel-2: #131b2e;
    --gold: #d4af6a;
    --gold-bright: #f0c880;
    --green: #3ddc97;
    --red: #ff5c5c;
    --text-primary: #eef2fb;
    --text-dim: #7a869e;
    --border: rgba(212,175,106,0.14);
  }
  * { 
    box-sizing: border-box; 
    /* Блокировка выделения текста */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    overscroll-behavior: none;
    overflow: hidden; /* Отключение скроллинга всей страницы */
    touch-action: manipulation;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  #shark-root {
    position: relative;
    width: 100%;
    max-width: 430px;
    min-width: 320px;
    margin: 0 auto;
    height: 100vh;
    min-height: 640px;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(14,42,74,0.55), transparent 60%),
      linear-gradient(180deg, var(--bg-void), var(--bg-deep));
    color: var(--text-primary);
    overflow: hidden;
    touch-action: none;
  }
  @media (min-width: 480px) {
    #shark-root {
      border-radius: 28px;
      margin-top: 3vh;
      height: 94vh;
      box-shadow: 0 0 0 1px rgba(212,175,106,0.08), 0 30px 80px rgba(0,0,0,0.6);
    }
  }

  .screen {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: 18px 18px 100px 18px;
    display: none;
    -webkit-overflow-scrolling: touch;
  }
  .screen.active { display: block; }
  .screen::-webkit-scrollbar { display: none; }

  /* HOME */
  .home-screen.active { display: flex; flex-direction: column; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; letter-spacing: 0.18em; color: var(--gold-bright); display: flex; align-items: center; gap: 6px; }
  .brand-mark { font-size: 11px; color: var(--gold); }
  .daily-btn { font-size: 12px; font-weight: 600; background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-primary); padding: 7px 12px; border-radius: 100px; cursor: pointer; }

  .balance-block { text-align: center; margin-bottom: 16px; }
  .balance-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--text-dim); margin-bottom: 4px; }
  .balance-value { font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 700; background: linear-gradient(180deg, #ffffff, #c9d4e8); -webkit-background-clip: text; background-clip: text; color: transparent; display: block; }
  .income-row { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; background: rgba(61,220,151,0.08); border: 1px solid rgba(61,220,151,0.25); padding: 4px 12px; border-radius: 100px; }
  .income-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .income-value { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--green); font-weight: 600; }

  .level-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .level-card-top { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .level-name { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: var(--gold-bright); letter-spacing: 0.05em; }
  .level-next { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 0.05em; }
  .progress-track { height: 6px; background: rgba(255,255,255,0.06); border-radius: 100px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-bright)); border-radius: 100px; transition: width 0.6s ease; box-shadow: 0 0 10px rgba(212,175,106,0.5); }

  .energy-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .energy-icon { font-size: 13px; }
  .energy-track { flex: 1; height: 5px; background: rgba(255,255,255,0.06); border-radius: 100px; overflow: hidden; }
  .energy-fill { height: 100%; background: linear-gradient(90deg, #4a9eff, #7cc3ff); border-radius: 100px; transition: width 0.4s ease; }
  .energy-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); }

  .shark-stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; min-height: 190px; touch-action: none; }
  .shark-tap-btn {
    position: relative; width: 190px; height: 190px; border-radius: 50%;
    border: 2px solid rgba(212,175,106,0.45);
    background: radial-gradient(circle at 50% 45%, rgba(28,52,82,0.95), rgba(12,18,31,0.98) 68%);
    box-shadow: 0 0 0 8px rgba(212,175,106,0.035), 0 14px 45px rgba(0,0,0,0.5), inset 0 0 35px rgba(74,158,255,0.08);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s ease, border-color 0.15s ease;
    touch-action: manipulation;
  }
  .shark-tap-btn:active { transform: scale(0.94); border-color: rgba(240,200,128,0.8); }
  .shark-glow { position: absolute; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(74,158,255,0.28), transparent 70%); transition: transform 0.15s ease, opacity 0.15s ease; pointer-events: none; }
  .shark-glow.pulse { transform: scale(1.15); }
  .shark-figure { font-size: 92px; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.6)); transform: scaleX(-1); position: relative; z-index: 1; pointer-events: none; }

  .floater { position: fixed; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; color: var(--green); pointer-events: none; animation: floatUp 0.9s ease-out forwards; z-index: 50; text-shadow: 0 0 12px rgba(61,220,151,0.6); }
  @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }

  .screen-header { margin-bottom: 16px; }
  .screen-title { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; }
  .screen-subtitle { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  .biz-list { display: flex; flex-direction: column; gap: 10px; }
  .biz-card { display: flex; align-items: center; gap: 12px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 12px; }
  .biz-icon { font-size: 26px; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; background: var(--bg-panel-2); border-radius: 12px; flex-shrink: 0; }
  .biz-info { flex: 1; min-width: 0; }
  .biz-name-row { display: flex; align-items: center; gap: 6px; }
  .biz-name { font-size: 13px; font-weight: 600; }
  .biz-count { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--gold); background: rgba(212,175,106,0.1); padding: 1px 6px; border-radius: 100px; }
  .biz-income { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--green); margin-top: 3px; }
  .biz-buy { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-panel-2); cursor: pointer; flex-shrink: 0; }
  .biz-buy-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--gold-bright); letter-spacing: 0.08em; }
  .biz-buy-price { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; }
  .biz-buy-disabled { opacity: 0.4; }

  .profile-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 18px; padding: 22px; text-align: center; margin-bottom: 18px; }
  .profile-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--bg-panel-2); display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 10px auto; border: 1px solid var(--border); overflow: hidden; }
  .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .profile-level { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold-bright); letter-spacing: 0.1em; margin-bottom: 16px; }
  .profile-stats { display: flex; justify-content: space-around; }
  .profile-stat-label { font-size: 10px; color: var(--text-dim); }
  .profile-stat-value { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; margin-top: 3px; }

  .ach-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; }
  .ach-list { display: flex; flex-direction: column; gap: 8px; }
  .ach-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; border: 1px solid var(--border); }
  .ach-unlocked { background: rgba(212,175,106,0.06); }
  .ach-locked { background: var(--bg-panel); opacity: 0.55; }
  .ach-icon { font-size: 20px; }
  .ach-name { font-size: 13px; font-weight: 600; }
  .ach-desc { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

  .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; display: flex; background: rgba(10,15,28,0.9); backdrop-filter: blur(16px); border-top: 1px solid var(--border); padding: 8px 6px 14px 6px; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; padding: 6px 0; cursor: pointer; color: var(--text-dim); }
  .nav-icon { font-size: 18px; opacity: 0.6; transition: opacity 0.2s; }
  .nav-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.04em; }
  .nav-item.active { color: var(--gold-bright); }
  .nav-item.active .nav-icon { opacity: 1; filter: drop-shadow(0 0 6px rgba(212,175,106,0.6)); }

  .modal-overlay { position: absolute; inset: 0; background: rgba(3,5,10,0.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal-card { width: 100%; max-width: 320px; background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel)); border: 1px solid rgba(212,175,106,0.35); border-radius: 20px; padding: 26px 22px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .modal-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: var(--gold); }
  .modal-icon { font-size: 40px; margin: 14px 0 6px 0; }
  .modal-label { font-size: 12px; color: var(--text-dim); }
  .modal-amount { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; color: var(--green); margin: 6px 0 20px 0; }
  .modal-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(90deg, var(--gold), var(--gold-bright)); color: #14100a; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; cursor: pointer; }
  .modal-btn-disabled { opacity: 0.4; cursor: default; }

  .daily-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 16px 0 20px 0; }
  .daily-cell { position: relative; background: var(--bg-void); border: 1px solid var(--border); border-radius: 10px; padding: 8px 4px; }
  .daily-cell:nth-child(7) { grid-column: span 2; }
  .daily-cell-day { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--text-dim); }
  .daily-cell-amount { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; margin-top: 2px; }
  .daily-cell-past { opacity: 0.4; }
  .daily-cell-today { border-color: var(--gold); box-shadow: 0 0 12px rgba(212,175,106,0.3); }
  .daily-cell-check { position: absolute; top: 2px; right: 4px; font-size: 9px; color: var(--green); }

  .levelup-banner { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 200; pointer-events: none; opacity: 0; }
  .levelup-banner.show { animation: levelPop 2.4s ease forwards; }
  @keyframes levelPop { 0% { opacity: 0; transform: translate(-50%, -40%) scale(0.7); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 25% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -55%) scale(1); } }
  .levelup-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.3em; color: var(--gold); }
  .levelup-name { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700; color: var(--gold-bright); text-shadow: 0 0 30px rgba(212,175,106,0.6); margin-top: 4px; }

  .toast { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(15,22,38,0.95); border: 1px solid var(--border); color: var(--text-primary); font-size: 12px; padding: 10px 18px; border-radius: 100px; z-index: 150; white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="shark-root">

  <!-- HOME -->
  <div class="screen home-screen active" id="screen-home">
    <div class="top-bar">
      <div class="brand"><span class="brand-mark">◆</span> SHARK</div>
      <button class="daily-btn" id="daily-open-btn">🎁 Daily</button>
    </div>
    <div class="balance-block">
      <div class="balance-label">Balance</div>
      <span class="balance-value mono" id="balance-value">0 SP</span>
      <div class="income-row">
        <span class="income-dot"></span>
        <span class="income-value mono" id="income-value">+0 SP / hour</span>
      </div>
    </div>
    <div class="level-card">
      <div class="level-card-top">
        <span class="level-name" id="level-name">ROOKIE</span>
        <span class="level-next" id="level-next">NEXT: TRADER</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="energy-row">
      <span class="energy-icon">⚡</span>
      <div class="energy-track"><div class="energy-fill" id="energy-fill" style="width:100%"></div></div>
      <span class="energy-text mono" id="energy-text">1000/1000</span>
    </div>
    <div class="shark-stage">
      <button class="shark-tap-btn" id="shark-tap-btn" aria-label="Tap shark">
        <div class="shark-glow" id="shark-glow"></div>
        <div class="shark-figure">🦈</div>
      </button>
    </div>
  </div>

  <!-- BUSINESS -->
  <div class="screen" id="screen-business">
    <div class="screen-header">
      <div class="screen-title mono">Business</div>
      <div class="screen-subtitle">Build your passive empire</div>
    </div>
    <div class="biz-list" id="biz-list"></div>
  </div>

  <!-- PROFILE -->
  <div class="screen" id="screen-profile">
    <div class="screen-header"><div class="screen-title mono">Profile</div></div>
    <div class="profile-card">
      <div class="profile-avatar" id="profile-avatar">🦈</div>
      <div class="profile-name" id="profile-name">SHARK</div>
      <div class="profile-level mono" id="profile-level">ROOKIE</div>
      <div class="profile-stats">
        <div class="profile-stat"><div class="profile-stat-label">Net Worth</div><div class="profile-stat-value mono" id="profile-networth">$0</div></div>
        <div class="profile-stat"><div class="profile-stat-label">Businesses</div><div class="profile-stat-value mono" id="profile-biz">0</div></div>
        <div class="profile-stat"><div class="profile-stat-label">Rank</div><div class="profile-stat-value mono" id="profile-rank">#...</div></div>
      </div>
    </div>
    <div class="ach-section">
      <div class="ach-title mono">Achievements</div>
      <div class="ach-list" id="ach-list"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" data-tab="home"><span class="nav-icon">🏠</span><span class="nav-label mono">Home</span></button>
    <button class="nav-item" data-tab="business"><span class="nav-icon">💼</span><span class="nav-label mono">Business</span></button>
    <button class="nav-item" data-tab="profile"><span class="nav-icon">👤</span><span class="nav-label mono">Profile</span></button>
  </div>

  <!-- Welcome back modal -->
  <div class="modal-overlay" id="welcome-modal">
    <div class="modal-card">
      <div class="modal-eyebrow mono">WELCOME BACK</div>
      <div class="modal-icon">💰</div>
      <div class="modal-label">You earned</div>
      <div class="modal-amount mono" id="welcome-amount">+0 SP</div>
      <button class="modal-btn mono" id="welcome-close-btn">COLLECT</button>
    </div>
  </div>

  <!-- Daily modal -->
  <div class="modal-overlay" id="daily-modal">
    <div class="modal-card">
      <div class="modal-eyebrow mono">DAILY REWARD</div>
      <div class="daily-grid" id="daily-grid"></div>
      <button class="modal-btn mono" id="daily-claim-btn">CLAIM</button>
    </div>
  </div>

  <div class="levelup-banner" id="levelup-banner">
    <div class="levelup-eyebrow mono">LEVEL UP</div>
    <div class="levelup-name mono" id="levelup-name">TRADER</div>
  </div>

  <div class="toast mono" id="toast"></div>
</div>

<script>
(function () {
  "use strict";

  // Блокировка масштабирования жестами
  document.addEventListener('gesturestart', function (e) {
    e.preventDefault();
  });

  // Перебалансировка уровней под умеренную экономику
  const LEVELS = [
    { name: "Rookie", threshold: 0, incomeMult: 1 },
    { name: "Trader", threshold: 5000, incomeMult: 1.2 },
    { name: "Broker", threshold: 50000, incomeMult: 1.5 },
    { name: "Investor", threshold: 250000, incomeMult: 2.0 },
    { name: "Banker", threshold: 1000000, incomeMult: 2.5 },
    { name: "CEO", threshold: 10000000, incomeMult: 3.5 },
    { name: "Tycoon", threshold: 50000000, incomeMult: 5.0 },
    { name: "Shark Lord", threshold: 250000000, incomeMult: 8.0 },
  ];

  // Сбалансированная бизнес-сетка под Airdrop
  const BUSINESS_DATA = [
    { id: "office", name: "Small Office", icon: "🏢", basePrice: 2500, baseIncome: 150 },
    { id: "brokerage", name: "Brokerage", icon: "📊", basePrice: 25000, baseIncome: 1200 },
    { id: "bank", name: "Bank", icon: "🏦", basePrice: 250000, baseIncome: 10000 },
    { id: "tech", name: "Tech Company", icon: "💻", basePrice: 2500000, baseIncome: 85000 },
    { id: "ai", name: "AI Corporation", icon: "🤖", basePrice: 25000000, baseIncome: 700000 },
    { id: "space", name: "Space Company", icon: "🚀", basePrice: 250000000, baseIncome: 6000000 },
  ];

  const ACHIEVEMENTS = [
    { id: "first", name: "First Deal", desc: "Make your first deal.", check: s => s.deals >= 1 },
    { id: "millionaire", name: "Millionaire", desc: "Reach $1,000,000.", check: s => s.balance >= 1000000 },
    { id: "banker", name: "Banker", desc: "Buy your first bank.", check: s => (s.owned.bank || 0) >= 1 },
    { id: "tycoon", name: "Tycoon", desc: "Reach $50,000,000.", check: s => s.balance >= 50000000 },
    { id: "whale", name: "Whale", desc: "Reach $250,000,000.", check: s => s.balance >= 250000000 },
  ];

  // Награды адаптивно снижены для устойчивости к аирдропу
  const DAILY_REWARDS = [500, 1000, 2500, 5000, 10000, 25000, 50000];
  const SAVE_KEY = "shark_game_save_v2"; // Обновленный ключ сохранения

  const MAX_ENERGY = 1000;

  // Данные пользователя Telegram
  let tgUser = null;
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      tgUser = tg.initDataUnsafe.user;
    }
  }

  function formatMoney(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
    return Math.floor(n).toLocaleString();
  }
  function formatFull(n) { return Math.floor(n).toLocaleString("en-US"); }
  function getLevelIdx(balance) {
    let idx = 0;
    for (let i = 0; i < LEVELS.length; i++) if (balance >= LEVELS[i].threshold) idx = i;
    return idx;
  }
  function businessPrice(base, owned) { return Math.floor(base * Math.pow(1.15, owned)); }
  function businessIncome(base, owned) { return Math.floor(base * owned); }

  // ---- ПРИСВОЕНИЕ РАНГА ПО ЮЗЕРНЕЙМУ ----
  const ADMIN_USERNAME = "wertycoco";

  function generateRandomRank() {
    if (tgUser && tgUser.username && tgUser.username.toLowerCase() === ADMIN_USERNAME.toLowerCase()) {
      return 1;
    }
    return Math.floor(Math.random() * (10000 - 2 + 1)) + 2;
  }

  // ---- state ----
  const PROFILE_VERSION = 4;
  let state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s.profileVersion !== PROFILE_VERSION) {
          localStorage.removeItem(SAVE_KEY);
          return createDefaultState();
        }
        return {
          profileVersion: PROFILE_VERSION,
          userRank: s.userRank ?? generateRandomRank(),
          balance: s.balance ?? 0,
          energy: s.energy ?? MAX_ENERGY,
          deals: s.deals ?? 0,
          owned: s.owned ?? {},
          unlockedAch: s.unlockedAch ?? {},
          dailyDay: s.dailyDay ?? 1,
          dailyClaimedAt: s.dailyClaimedAt ?? null,
          lastActive: s.lastActive ?? Date.now(),
        };
      }
    } catch (e) {}
    return createDefaultState();
  }

  function createDefaultState() {
    return {
      profileVersion: PROFILE_VERSION,
      userRank: generateRandomRank(),
      balance: 0,
      energy: MAX_ENERGY,
      deals: 0,
      owned: {},
      unlockedAch: {},
      dailyDay: 1,
      dailyClaimedAt: null,
      lastActive: Date.now() - 1000 * 60 * 62,
    };
  }

  function saveState() {
    state.profileVersion = PROFILE_VERSION;
    state.lastActive = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  }

  function getPassiveIncome() {
    const base = BUSINESS_DATA.reduce((sum, b) => sum + businessIncome(b.baseIncome, state.owned[b.id] || 0), 0);
    return base * LEVELS[getLevelIdx(state.balance)].incomeMult;
  }

  // ---- DOM refs ----
  const $ = id => document.getElementById(id);
  const balanceEl = $("balance-value");
  const incomeEl = $("income-value");
  const levelNameEl = $("level-name");
  const levelNextEl = $("level-next");
  const progressFillEl = $("progress-fill");
  const energyFillEl = $("energy-fill");
  const energyTextEl = $("energy-text");
  const sharkTapBtn = $("shark-tap-btn");
  const sharkGlow = $("shark-glow");
  const toastEl = $("toast");

  let displayedBalance = state.balance;
  let prevLevelIdx = getLevelIdx(state.balance);

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove("show"), 1600);
  }

  function animateBalanceTo(target) {
    const start = displayedBalance;
    const startTime = performance.now();
    const duration = 400;
    function step(now) {
      const t = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      displayedBalance = start + (target - start) * eased;
      balanceEl.textContent = formatFull(displayedBalance) + " SP";
      if (t < 1) requestAnimationFrame(step);
      else displayedBalance = target;
    }
    requestAnimationFrame(step);
  }

  function renderHome() {
    animateBalanceTo(state.balance);
    incomeEl.textContent = "+" + formatMoney(getPassiveIncome()) + " SP / hour";
    const idx = getLevelIdx(state.balance);
    const level = LEVELS[idx];
    const next = LEVELS[idx + 1];
    levelNameEl.textContent = level.name.toUpperCase();
    levelNextEl.textContent = next ? "NEXT: " + next.name.toUpperCase() : "MAX LEVEL";
    const progress = next ? ((state.balance - level.threshold) / (next.threshold - level.threshold)) * 100 : 100;
    progressFillEl.style.width = Math.min(100, progress) + "%";
    
    // Энергетическая шкала
    const energyPct = (state.energy / MAX_ENERGY) * 100;
    energyFillEl.style.width = energyPct + "%";
    energyTextEl.textContent = state.energy + "/" + MAX_ENERGY;

    if (idx > prevLevelIdx) {
      prevLevelIdx = idx;
      showLevelUp(level.name);
    }
  }

  function showLevelUp(name) {
    const banner = $("levelup-banner");
    $("levelup-name").textContent = name.toUpperCase();
    banner.classList.remove("show");
    void banner.offsetWidth;
    banner.classList.add("show");
  }

  function renderBusiness() {
    const list = $("biz-list");
    list.innerHTML = "";
    BUSINESS_DATA.forEach(b => {
      const count = state.owned[b.id] || 0;
      const price = businessPrice(b.basePrice, count);
      const income = businessIncome(b.baseIncome, count);
      const affordable = state.balance >= price;
      const card = document.createElement("div");
      card.className = "biz-card";
      card.innerHTML = `
        <div class="biz-icon">${b.icon}</div>
        <div class="biz-info">
          <div class="biz-name-row">
            <span class="biz-name">${b.name}</span>
            ${count > 0 ? `<span class="biz-count mono">×${count}</span>` : ""}
          </div>
          <div class="biz-income mono">${count > 0 ? "+" + formatMoney(income) + " SP/hour" : "Passive income: 0 SP/hour"}</div>
        </div>
        <button class="biz-buy ${affordable ? "" : "biz-buy-disabled"}">
          <span class="biz-buy-label mono">${count > 0 ? "UPGRADE" : "BUY"}</span>
          <span class="biz-buy-price mono">${formatMoney(price)} SP</span>
        </button>
      `;
      card.querySelector(".biz-buy").addEventListener("click", () => buyBusiness(b));
      list.appendChild(card);
    });
  }

  function buyBusiness(b) {
    const count = state.owned[b.id] || 0;
    const price = businessPrice(b.basePrice, count);
    if (state.balance < price) { showToast("Not enough cash"); return; }
    state.balance -= price;
    state.owned[b.id] = count + 1;
    showToast(b.name + " acquired");
    saveState();
    renderHome(); renderBusiness(); renderProfile(); checkAchievements();
  }

  function renderProfile() {
    const idx = getLevelIdx(state.balance);
    
    let displayName = "SHARK";
    if (tgUser) {
      displayName = tgUser.first_name + (tgUser.last_name ? " " + tgUser.last_name : "");
    }
    
    $("profile-name").textContent = displayName;
    $("profile-level").textContent = LEVELS[idx].name.toUpperCase();
    $("profile-networth").textContent = formatMoney(state.balance) + " SP";
    const total = Object.values(state.owned).reduce((a, b) => a + b, 0);
    $("profile-biz").textContent = total;
    
    if (tgUser && tgUser.username && tgUser.username.toLowerCase() === ADMIN_USERNAME.toLowerCase()) {
      state.userRank = 1;
    }
    
    $("profile-rank").textContent = "#" + state.userRank.toLocaleString();

    const avatarEl = $("profile-avatar");
    if (tgUser && tgUser.photo_url) {
      avatarEl.innerHTML = `<img src="${tgUser.photo_url}" alt="Avatar">`;
    } else if (tgUser && tgUser.first_name) {
      avatarEl.textContent = tgUser.first_name.charAt(0).toUpperCase();
    } else {
      avatarEl.textContent = "🦈";
    }

    const list = $("ach-list");
    list.innerHTML = "";
    ACHIEVEMENTS.forEach(a => {
      const unlocked = !!state.unlockedAch[a.id];
      const card = document.createElement("div");
      card.className = "ach-card " + (unlocked ? "ach-unlocked" : "ach-locked");
      card.innerHTML = `
        <div class="ach-icon">${unlocked ? "🏆" : "🔒"}</div>
        <div>
          <div class="ach-name">${a.name}</div>
          <div class="ach-desc">${a.desc}</div>
        </div>
      `;
      list.appendChild(card);
    });
  }

  function checkAchievements() {
    ACHIEVEMENTS.forEach(a => {
      if (a.check(state) && !state.unlockedAch[a.id]) {
        state.unlockedAch[a.id] = true;
        showToast("Achievement unlocked: " + a.name);
        saveState();
      }
    });
  }

  function spawnFloater(x, y, amount) {
    const el = document.createElement("div");
    el.className = "floater";
    el.style.left = (x - 20) + "px";
    el.style.top = (y - 20) + "px";
    el.textContent = "+" + amount.toLocaleString() + " SP";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  function makeDeal(e) {
    if (state.energy <= 0) { showToast("Not enough energy"); return; }
    
    // Перебалансированный доход за клик
    const gain = 1; 
    
    state.balance += gain;
    state.energy = Math.max(0, state.energy - 1);
    state.deals += 1;
    saveState();

    const rect = sharkTapBtn.getBoundingClientRect();
    const x = e && e.clientX ? e.clientX : (e && e.touches ? e.touches[0].clientX : rect.left + rect.width / 2);
    const y = e && e.clientY ? e.clientY : (e && e.touches ? e.touches[0].clientY : rect.top);
    spawnFloater(x, y, gain);

    if (window.Telegram?.WebApp?.HapticFeedback) {
      window.Telegram.WebApp.HapticFeedback.impactOccurred("light");
    } else if (window.navigator?.vibrate) {
      window.navigator.vibrate(8);
    }

    renderHome();
    renderProfile();
    checkAchievements();
  }

  // Нажатия и стили
  sharkTapBtn.addEventListener("mousedown", () => sharkGlow.classList.add("pulse"));
  sharkTapBtn.addEventListener("mouseup", () => sharkGlow.classList.remove("pulse"));
  sharkTapBtn.addEventListener("mouseleave", () => sharkGlow.classList.remove("pulse"));
  sharkTapBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    sharkGlow.classList.add("pulse");
    makeDeal(e);
  }, { passive: false });
  
  sharkTapBtn.addEventListener("touchend", () => sharkGlow.classList.remove("pulse"));
  sharkTapBtn.addEventListener("click", (e) => {
    if (e.detail !== 0) makeDeal(e);
  });

  // Вкладки
  document.querySelectorAll(".nav-item").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      $("screen-" + btn.dataset.tab).classList.add("active");
    });
  });

  // Быстрое восстановление энергии (+3 ед/сек)
  setInterval(() => {
    if (state.energy < MAX_ENERGY) {
      state.energy = Math.min(MAX_ENERGY, state.energy + 3);
      saveState();
      renderHome();
    }
  }, 1000);

  // Пассивный доход
  setInterval(() => {
    state.balance += getPassiveIncome() / 3600;
    saveState();
    renderHome();
    renderProfile();
    checkAchievements();
  }, 1000);

  // Ежедневные бонусы
  const dailyModal = $("daily-modal");
  const welcomeModal = $("welcome-modal");

  function isSameDay(a, b) {
    const da = new Date(a), db = new Date(b);
    return da.toDateString() === db.toDateString();
  }

  function renderDailyModal() {
    const grid = $("daily-grid");
    grid.innerHTML = "";
    const claimedToday = state.dailyClaimedAt && isSameDay(state.dailyClaimedAt, Date.now());
    DAILY_REWARDS.forEach((amount, i) => {
      const dayNum = i + 1;
      const isPast = dayNum < state.dailyDay;
      const isToday = dayNum === state.dailyDay;
      const cell = document.createElement("div");
      cell.className = "daily-cell" + (isPast ? " daily-cell-past" : "") + (isToday ? " daily-cell-today" : "");
      cell.innerHTML = `
        <div class="daily-cell-day mono">DAY ${dayNum}</div>
        <div class="daily-cell-amount mono">${formatMoney(amount)} SP</div>
        ${isPast ? '<div class="daily-cell-check">✓</div>' : ""}
      `;
      grid.appendChild(cell);
    });
    const claimBtn = $("daily-claim-btn");
    claimBtn.textContent = claimedToday ? "CLAIMED" : "CLAIM DAY " + state.dailyDay;
    claimBtn.className = "modal-btn mono" + (claimedToday ? " modal-btn-disabled" : "");
  }

  $("daily-open-btn").addEventListener("click", () => {
    renderDailyModal();
    dailyModal.classList.add("active");
  });
  dailyModal.addEventListener("click", (e) => { if (e.target === dailyModal) dailyModal.classList.remove("active"); });

  $("daily-claim-btn").addEventListener("click", () => {
    const claimedToday = state.dailyClaimedAt && isSameDay(state.dailyClaimedAt, Date.now());
    if (claimedToday) return;
    const reward = DAILY_REWARDS[state.dailyDay - 1];
    state.balance += reward;
    state.dailyClaimedAt = Date.now();
    state.dailyDay = state.dailyDay >= 7 ? 1 : state.dailyDay + 1;
    saveState();
    showToast("Daily reward claimed: +" + formatMoney(reward) + " SP");
    renderHome(); renderProfile(); renderDailyModal();
  });

  welcomeModal.addEventListener("click", (e) => { if (e.target === welcomeModal) welcomeModal.classList.remove("active"); });
  $("welcome-close-btn").addEventListener("click", () => welcomeModal.classList.remove("active"));

  // Офлайн-заработок
  function checkWelcomeBack() {
    const hoursAway = (Date.now() - (state.lastActive || Date.now())) / 1000 / 3600;
    const earned = Math.floor(getPassiveIncome() * hoursAway);
    if (earned > 10) {
      state.balance += earned;
      saveState();
      $("welcome-amount").textContent = "+" + formatMoney(earned) + " SP";
      setTimeout(() => welcomeModal.classList.add("active"), 500);
    }
  }

  // Инициализация
  renderHome();
  renderBusiness();
  renderProfile();
  checkWelcomeBack();
})();
</script>
</body>
</html>
